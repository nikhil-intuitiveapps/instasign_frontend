services:
  server:
    image: opensign/opensignserver:main
    container_name: InstaSignServer-Container
    volumes:
      - opensign-files:/usr/src/app/files
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - PORT=8080
    networks:
      - app-network
  mongo:
    image: mongo:8.2
    container_name: mongo-container
    volumes:
      - data-volume:/data/db
    ports:
      - "27018:27017"
    networks:
      - app-network
  client:
    image: opensign/opensign:main
    container_name: InstaSign-container
    depends_on:
      - server
    env_file: .env.prod
    ports:
      - "3090:3090"
    environment:
      - PORT=3090
    networks:
      - app-network
  nginx:
    image: nginx:latest
    container_name: nginx-container
    ports:
      - "8081:80"    # HTTP
      - "8443:443"   # HTTPS (if needed)
    volumes:
      - /etc/nginx/nginx.conf:/etc/nginx/nginx.conf  # Mount the custom nginx.conf
      - /etc/nginx/certs:/etc/nginx/certs           # Optional: SSL certificates for HTTPS
    depends_on:
      - client
    networks:
      - app-network
networks:
  app-network:
    driver: bridge

volumes:
  data-volume:
  web-root:
  caddy_data:
  caddy_config:
  opensign-files:
